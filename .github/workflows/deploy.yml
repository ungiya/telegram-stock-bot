# Cloudflare Workers Builds is the production deployment owner for this repository.
# It is connected to main and deploys automatically via Cloudflare's own Git integration.
# Do not run a second Wrangler deploy here: no GitHub Cloudflare secrets are required.
name: Test stock-news bot (Cloudflare handles deployment)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "test/**"
      - "migrations/**"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "test/**"
      - "migrations/**"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"

jobs:
  tests:
    name: Run Node.js tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run all tests
        run: npm test
